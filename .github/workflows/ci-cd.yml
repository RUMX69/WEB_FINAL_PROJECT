# ── EduLearn GitHub Actions CI/CD Pipeline ───────────
# Runs automatically on every push to the main branch

name: EduLearn CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # Job 1: Install and verify backend
  backend:
    name: Backend — Install & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./EduLearn/backend
        run: npm install

  # Job 2: Install and build frontend
  frontend:
    name: Frontend — Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./EduLearn/frontend
        run: npm install

      - name: Build React app
        working-directory: ./EduLearn/frontend
        run: ./node_modules/.bin/vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # Job 3: Build Docker images (runs after both jobs above pass)
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t edulearn-backend ./EduLearn/backend

      - name: Build frontend Docker image
        run: docker build -t edulearn-frontend ./EduLearn/frontend

  # Job 4: Deploy backend to Render
  # Triggers Render's deploy hook so the backend redeploys on every push.
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "https://api.render.com/deploy/srv-d85v4jrtqb8s73c0aqr0?key=Ku1BF7PY6BQ"

  # Job 5: Deploy frontend to Vercel
  # Triggers Vercel's deploy hook so the frontend redeploys on every push.
  # ?buildCache=0 forces a clean build, preventing Vercel from serving stale cached code.
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_DiayyEInKevEbCupxQ5svKYjHBHS/X7h8pRYtMF"